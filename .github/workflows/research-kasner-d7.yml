name: Research exact d7 Kasner ACD

on:
  push:
    paths:
      - "tools/derive_d7_lrs_kasner_parent_volume_exact.py"
      - ".github/workflows/research-kasner-d7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d7-kasner:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SymPy
        run: python -m pip install "sympy==1.14.0"

      - name: Verify exact d7 LRS-Kasner ACD volume
        run: python tools/derive_d7_lrs_kasner_parent_volume_exact.py
