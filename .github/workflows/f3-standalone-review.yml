name: MF-R049 focused standalone review checks

on:
  push:
    branches:
      - review/f3-self-contained-2026-11-03
    paths:
      - "manuscripts/standalone/f3/**"
      - "tools/f3_standalone_exact.py"
      - "formal/lean/AssuranceF3Standalone.lean"
      - ".github/workflows/f3-standalone-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Standalone exact rational and adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m py_compile tools/f3_standalone_exact.py
          python tools/f3_standalone_exact.py

  lean-f3:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit)\b' formal/lean --include='*.lean'; then
            exit 1
          fi
      - name: Bootstrap repository-pinned Lean
        working-directory: formal/lean
        shell: bash
        run: |
          set -euo pipefail
          test -f lake-manifest.json
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true
      - name: Print F3 theorem axioms
        working-directory: formal/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AssuranceF3Standalone.lean
      - name: Replay both source modules in leanchecker
        working-directory: formal/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env leanchecker PrecategoryFormal.DynamicNonclosure
          lake env leanchecker PrecategoryFormal.DynamicNonclosureTransport
          echo "MF-R049/F3 dedicated Lean proof replays PASS"

# Passing this workflow means exact-code/Lean verification, not outside peer review.
