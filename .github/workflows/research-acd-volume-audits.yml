name: Research ACD volume audits

on:
  push:
    paths:
      - "tools/audit_wang2019_d4_acd_volume_eq79.py"
      - "tools/audit_wang2019_alld_acd_volume_eq79.py"
      - "tools/verify_alld_cahen_wallach_acd_volume.py"
      - "tools/verify_alld_weyl_angular_contractions.py"
      - "tools/derive_d5_lrs_kasner_parent_volume_exact.py"
      - "tools/derive_d6_lrs_kasner_parent_volume_exact.py"
      - "tools/derive_d5_boosted_kasner_weyl_target.py"
      - "tools/derive_d5_boosted_kasner_timelike_tip_jets.py"
      - "tools/derive_d5_kasner_null_cone_profile_jets.py"
      - "tools/derive_d5_boosted_flat_lens_switching.py"
      - "tools/verify_three_ball_lens_c1_switching.py"
      - "tools/derive_d5_boosted_kasner_lens_time_switch_jets.py"
      - "tools/derive_d5_boosted_kasner_contained_tail_exact.py"
      - "tools/audit_wang2019_electric_plus8_localization.py"
      - "tools/verify_acd_corrected_vs_printed_exact_geometries.py"
      - ".github/workflows/research-acd-volume-audits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-acd-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency
        run: python -m pip install "sympy==1.14.0"

      - name: Audit d4 Wang volume
        run: python tools/audit_wang2019_d4_acd_volume_eq79.py

      - name: Audit all-d Wang volume
        run: python tools/audit_wang2019_alld_acd_volume_eq79.py

      - name: Verify all-d Cahen-Wallach combination
        run: python tools/verify_alld_cahen_wallach_acd_volume.py

      - name: Verify exact d5 LRS-Kasner volume
        run: python tools/derive_d5_lrs_kasner_parent_volume_exact.py

      - name: Verify exact d6 LRS-Kasner volume
        run: python tools/derive_d6_lrs_kasner_parent_volume_exact.py

      - name: Verify boosted d5 Kasner Weyl target
        run: python tools/derive_d5_boosted_kasner_weyl_target.py

      - name: Verify exact boosted d5 Kasner timelike tip jets
        run: python tools/derive_d5_boosted_kasner_timelike_tip_jets.py

      - name: Verify exact d5 Kasner null-cone profile jets
        run: python tools/derive_d5_kasner_null_cone_profile_jets.py

      - name: Verify exact boosted flat lens switching
        run: python tools/derive_d5_boosted_flat_lens_switching.py

      - name: Verify C1 matching of three-ball lens switches
        run: python tools/verify_three_ball_lens_c1_switching.py

      - name: Verify exact boosted d5 Kasner lens time-switch jets
        run: python tools/derive_d5_boosted_kasner_lens_time_switch_jets.py

      - name: Verify exact boosted d5 Kasner contained tail
        run: python tools/derive_d5_boosted_kasner_contained_tail_exact.py

      - name: Audit Wang electric +8 localization
        run: python tools/audit_wang2019_electric_plus8_localization.py

      - name: Verify corrected versus printed law on exact geometries
        run: python tools/verify_acd_corrected_vs_printed_exact_geometries.py

      - name: Stress random Weyl contractions
        run: python tools/verify_alld_weyl_angular_contractions.py
