name: Research boosted Kasner ACD volume

on:
  push:
    paths:
      - "tools/check_d5_boosted_kasner_acd_volume_numerically.py"
      - ".github/workflows/research-boosted-kasner-volume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boosted-kasner-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install "numpy==2.3.4" "scipy==1.16.3"

      - name: Check boosted d5 Kasner ACD volume
        run: python tools/check_d5_boosted_kasner_acd_volume_numerically.py
