name: A115-A122 exact arithmetic audits

on:
  push:
    branches:
      - "formal/**"
      - "research/a115-a119-uniform-remainder-20261110"
    paths:
      - "audits/a115_independent_central_reconstruction_20261106.py"
      - "audits/a115_independent_feasibility_bounds_20261106.py"
      - "audits/a115_near_wall_exact_counterexamples_20261106.py"
      - "audits/a115_independent_three_site_primal_bridge_20261106.py"
      - "audits/a115_independent_compressed_adjacent_identity_20261107.py"
      - "audits/a115_gamma_band_contract_stress_20261107.py"
      - "audits/a115_unrestricted_centered_witness_20261107.py"
      - "audits/a115_explicit_full_primal_and_dual_gate_20261107.py"
      - "audits/a115_small_full_lp_exact_kkt_certificate_20261107.py"
      - "audits/a115_odd_m5_full_lp_exact_kkt_certificate_20261107.py"
      - "audits/a115_independent_primal_feasibility_and_orientation_20261107.py"
      - "audits/a115_source_numerator_sign_20261107.py"
      - "audits/a119_independent_fraction_certificate_20261106.py"
      - "audits/a119_compact_35box_fraction_certificate_20261110.py"
      - "audits/a119_independent_tail_and_entry_20261110.py"
      - "audits/a122_independent_rational_log_brackets_20261106.py"
      - ".github/workflows/a115-a122-exact-audits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record environment
        run: python --version
      - name: Check syntax
        run: |
          python -m py_compile \
            audits/a115_independent_central_reconstruction_20261106.py \
            audits/a115_independent_feasibility_bounds_20261106.py \
            audits/a115_near_wall_exact_counterexamples_20261106.py \
            audits/a115_independent_three_site_primal_bridge_20261106.py \
            audits/a115_independent_compressed_adjacent_identity_20261107.py \
            audits/a115_gamma_band_contract_stress_20261107.py \
            audits/a115_unrestricted_centered_witness_20261107.py \
            audits/a115_explicit_full_primal_and_dual_gate_20261107.py \
            audits/a115_small_full_lp_exact_kkt_certificate_20261107.py \
            audits/a115_odd_m5_full_lp_exact_kkt_certificate_20261107.py \
            audits/a115_independent_primal_feasibility_and_orientation_20261107.py \
            audits/a115_source_numerator_sign_20261107.py \
            audits/a119_independent_fraction_certificate_20261106.py \
            audits/a119_compact_35box_fraction_certificate_20261110.py \
            audits/a119_independent_tail_and_entry_20261110.py \
            audits/a122_independent_rational_log_brackets_20261106.py
      - name: A115 central reconstruction (exact fractions)
        run: python audits/a115_independent_central_reconstruction_20261106.py
      - name: A115 central feasibility boundaries (exact fractions)
        run: python audits/a115_independent_feasibility_bounds_20261106.py
      - name: A115 independent primal transform and ratio bridge
        run: python audits/a115_independent_three_site_primal_bridge_20261106.py
      - name: A115 compressed objective identity and sign orientation
        run: python audits/a115_independent_compressed_adjacent_identity_20261107.py
      - name: A115 P-feasibility equivalence and determinant orientation
        run: python audits/a115_independent_primal_feasibility_and_orientation_20261107.py
      - name: A115 source numerator cancellation and sign checks
        run: python audits/a115_source_numerator_sign_20261107.py
      - name: A115 inherited A81 gamma-band conditional stress
        run: python audits/a115_gamma_band_contract_stress_20261107.py
      - name: A115 full-band centered equal-measure sanity witness
        run: python audits/a115_unrestricted_centered_witness_20261107.py
      - name: A115 exact complete F2/F3 primal and dual row acceptance gates
        run: python audits/a115_explicit_full_primal_and_dual_gate_20261107.py
      - name: A115 fixed full-F3 exact KKT and uniqueness proof certificate
        run: python audits/a115_small_full_lp_exact_kkt_certificate_20261107.py
      - name: A115 odd-parity M5 exact full F3 KKT and uniqueness certificate
        run: python audits/a115_odd_m5_full_lp_exact_kkt_certificate_20261107.py
      - name: A115 near-wall refutations and rejected out-of-domain control
        run: python audits/a115_near_wall_exact_counterexamples_20261106.py
      - name: A119 independent interval covering (exact fractions)
        run: python audits/a119_independent_fraction_certificate_20261106.py
      - name: A119 compact 35-box rational positivity and fail-closed controls
        run: python audits/a119_compact_35box_fraction_certificate_20261110.py
      - name: A119 independent tail and contact-entry checks
        run: python audits/a119_independent_tail_and_entry_20261110.py
      - name: A122 rational logarithm sign brackets
        run: python audits/a122_independent_rational_log_brackets_20261106.py
