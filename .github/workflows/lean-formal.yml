name: Lean formal verification

on:
  push:
    branches:
      - main
      - "formal/**"
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit)\b' formal/lean --include='*.lean'; then
            echo "Lean source contains a forbidden proof placeholder."
            exit 1
          fi

      - name: Bootstrap pinned Lean environment
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          echo "--- pinned lake-manifest.json ---"
          cat lake-manifest.json

      - name: Build and kernel-check Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: false
          use-mathlib-cache: true
