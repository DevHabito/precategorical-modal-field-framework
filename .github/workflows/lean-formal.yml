name: Lean formal verification

on:
  push:
    branches:
      - main
      - "formal/**"
      - "research/a115-a119-uniform-remainder-20261110"
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit)\b' formal/lean --include='*.lean'; then
            echo "Lean source contains a forbidden proof placeholder."
            exit 1
          fi

      - name: Bootstrap pinned Lean environment
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          echo "--- pinned lake-manifest.json ---"
          cat lake-manifest.json

      - name: Build Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true

  leanchecker:
    needs: lean
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - PrecategoryFormal.EdgeAdditionReachability
          - PrecategoryFormal.EdgeToggleIndicatorBridge
          - PrecategoryFormal.EdgeToggleEnsembleBridge
          - PrecategoryFormal.EdgeToggleSemanticBridge
          - PrecategoryFormal.EdgeToggleSensitivity
          - PrecategoryFormal.GraphSCCBridge
          - PrecategoryFormal.LiteralRepresentativeCode
          - PrecategoryFormal.PosetBijection
          - PrecategoryFormal.PosetCountBridge
          - PrecategoryFormal.PosetEnumeration
          - PrecategoryFormal.PosetSemantics
          - PrecategoryFormal.RepresentativeCode
          - PrecategoryFormal.RepresentativeCodeType
          - PrecategoryFormal.RepresentativeCount
          - PrecategoryFormal.RepresentativeRealization
          - PrecategoryFormal.TargetDeformationAudit
          - PrecategoryFormal.TargetFactorTenChannel
          - PrecategoryFormal.TargetFactorBasisBridge
          - PrecategoryFormal.TargetPrimalBridge
          - PrecategoryFormal.CompressedAdjacentObjective
          - PrecategoryFormal.CompressedActualBandComparison
          - PrecategoryFormal.CompressedPrimalFeasibility
          - PrecategoryFormal.CompressedSourceNumerator
          - PrecategoryFormal.CompressedSourcePowerBound
          - PrecategoryFormal.FiniteLPWeakDuality
          - PrecategoryFormal.A119CompactCertificate
          - PrecategoryFormal.A119IntervalArithmetic
          - PrecategoryFormal.A119CriticalExpression
          - PrecategoryFormal.A119IntervalEvaluator
          - PrecategoryFormal.A119CertifiedExpression
          - PrecategoryFormal.A119BoxReplay
          - PrecategoryFormal.A119R4Remaining
          - PrecategoryFormal.A119R4Coverage
          - PrecategoryFormal.A119R5Boxes
          - PrecategoryFormal.A119R6Boxes
          - PrecategoryFormal.A119R7Boxes
          - PrecategoryFormal.A119R8R12Boxes
          - PrecategoryFormal.A119OddR13R19
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore exact Lean build cache
        uses: actions/cache/restore@v5
        with:
          path: formal/lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}---${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install pinned Lean toolchain
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"

      - name: Kernel replay ${{ matrix.module }}
        shell: bash
        working-directory: formal/lean
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env leanchecker "$MODULE"
