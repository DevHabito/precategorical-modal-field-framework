name: Lean formal verification

on:
  push:
    branches:
      - main
      - "formal/**"
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit)\b' formal/lean --include='*.lean'; then
            echo "Lean source contains a forbidden proof placeholder."
            exit 1
          fi

      - name: Bootstrap pinned Lean environment
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          echo "--- pinned lake-manifest.json ---"
          cat lake-manifest.json

      - name: Build Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true

  leanchecker:
    needs: lean
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - PrecategoryFormal.EdgeToggleBridge
          - PrecategoryFormal.EdgeToggleMaskBridge
          - PrecategoryFormal.EdgeToggleEnumeration
          - PrecategoryFormal.EdgeToggleFastSemantic
          - PrecategoryFormal.EdgeTogglePrecomputed
          - PrecategoryFormal.EdgeToggleFastCount
          - PrecategoryFormal.EdgeToggleEnsembleCore
          - PrecategoryFormal.EdgeToggleEnsembleSource0
          - PrecategoryFormal.EdgeToggleEnsembleSource1
          - PrecategoryFormal.EdgeToggleEnsembleSource2
          - PrecategoryFormal.EdgeToggleEnsembleSource3
          - PrecategoryFormal.EdgeToggleEnsembleSource4
          - PrecategoryFormal.EdgeToggleEnsembleCount
          - PrecategoryFormal.EdgeToggleReferenceCount
          - PrecategoryFormal.EdgeToggleSemantics
          - PrecategoryFormal.EdgeTogglePairing
          - PrecategoryFormal.EdgeToggleRelabel
          - PrecategoryFormal.GraphSCCBridge
          - PrecategoryFormal.LiteralRepresentativeCode
          - PrecategoryFormal.PosetBijection
          - PrecategoryFormal.PosetCountBridge
          - PrecategoryFormal.PosetEnumeration
          - PrecategoryFormal.PosetSemantics
          - PrecategoryFormal.RepresentativeCode
          - PrecategoryFormal.RepresentativeCodeType
          - PrecategoryFormal.RepresentativeCount
          - PrecategoryFormal.RepresentativeRealization
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore exact Lean build cache
        uses: actions/cache/restore@v5
        with:
          path: formal/lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}---${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install pinned Lean toolchain
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"

      - name: Kernel replay ${{ matrix.module }}
        shell: bash
        working-directory: formal/lean
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env leanchecker "$MODULE"
