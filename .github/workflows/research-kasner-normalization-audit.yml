name: Research Kasner normalization audit

on:
  push:
    paths:
      - "tools/derive_d4_kasner_world_function_pure_electric_calibration.py"
      - ".github/workflows/research-kasner-normalization-audit.yml"
  workflow_dispatch:

jobs:
  kasner-symbolic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency
        run: python -m pip install "sympy==1.14.0"

      - name: Run Kasner symbolic diagnostic
        run: python tools/derive_d4_kasner_world_function_pure_electric_calibration.py
