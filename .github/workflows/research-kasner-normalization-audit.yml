name: Research Kasner normalization audit

on:
  push:
    paths:
      - "tools/derive_d4_kasner_parent_volume_exact.py"
      - "tools/derive_d4_kasner_world_function_pure_electric_calibration.py"
      - "tools/derive_d4_kasner_parent_volume_directional_jets.py"
      - ".github/workflows/research-kasner-normalization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kasner-parent-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency
        run: python -m pip install "sympy==1.14.0"

      - name: Run stable exact Kasner parent-volume checker
        run: python tools/derive_d4_kasner_parent_volume_exact.py

      - name: Cross-check exact directional Kasner jets
        run: python tools/derive_d4_kasner_parent_volume_directional_jets.py
